[package]
name = "clauddy"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
eframe = "0.37.0"
getrandom = "0.4.3"
memchr = "2.8.3"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[dev-dependencies]
tempfile = "3.27.0"
