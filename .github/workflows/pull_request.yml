name: On pull request

# Without this a pull request reached review with nothing checked at all:
# release.yml only triggers on push to main.
on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true # a new push supersedes the run it replaced

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      - name: Test with coverage
        run: bun run test:coverage

  native:
    name: Native app · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      # the snapshot gallery renders through wgpu, which a macOS runner has
      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --release
