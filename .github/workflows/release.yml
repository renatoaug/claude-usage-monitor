name: Release

# Fully automated: every push to main runs semantic-release, which reads the
# Conventional Commits and — when there's something to ship — computes the
# version, builds the app on every platform, publishes to npm, and cuts a
# GitHub Release with all the artifacts. No version commit is pushed back to
# main (tag only).
#
# Three stages, because Windows/Linux artifacts can't be cross-built from macOS:
#   version -> build (matrix, stamps the version) -> publish (attaches them all)
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag + GitHub Release

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      - name: Test
        run: bun test

      - name: Dry-run semantic-release
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          bunx semantic-release --dry-run 2>&1 | tee release-dry-run.log
          version=$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p' release-dry-run.log | tail -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "No release due — skipping build and publish."
          else
            echo "Next version: $version"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist
            artifact: clauddy-macos
          - os: windows-latest
            dist: dist:win
            artifact: clauddy-windows
          - os: ubuntu-latest
            dist: dist:linux
            artifact: clauddy-linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build, skip signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      # electron-builder names artifacts from package.json — stamp the version
      # semantic-release is about to publish so the filenames match the release.
      - name: Stamp version
        run: node scripts/set-version.js ${{ needs.version.outputs.version }}

      - name: Build
        run: bun run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: clauddy-*
          merge-multiple: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release
