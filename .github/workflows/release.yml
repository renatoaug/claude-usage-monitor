name: Release

# Fully automated: every push to main runs semantic-release, which reads the
# Conventional Commits and — when there's something to ship — computes the
# version, builds the app on every platform, publishes to npm, and cuts a
# GitHub Release with all the artifacts. No version commit is pushed back to
# main (tag only).
#
# Three stages, because each platform's app is built on its own runner:
#   version -> build (matrix, stamps the version) -> publish (attaches them all)
# The app is the native one in native/ (Rust); see ADR-012.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag + GitHub Release

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      - name: Dry-run semantic-release
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          bunx semantic-release --dry-run 2>&1 | tee release-dry-run.log
          version=$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p' release-dry-run.log | tail -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "No release due — skipping build and publish."
          else
            echo "Next version: $version"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: clauddy-macos
          - os: windows-latest
            artifact: clauddy-windows
          - os: ubuntu-latest
            artifact: clauddy-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # the tray and its menu build against GTK on Linux
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # builds the app with the version semantic-release is about to publish,
      # so the file names and the update check match the release
      - name: Build and pack
        shell: bash
        run: native/scripts/package.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: clauddy-*
          merge-multiple: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release
