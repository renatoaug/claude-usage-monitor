name: CI

# Runs on every pull request, and on main as a safety net. release.yml only
# triggers on push to main, so without this a PR reached review with nothing
# checked at all.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a new push supersedes the run it replaced

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      # enforces the project-wide floor *and* that every shipped .js is tested
      - name: Test with coverage
        run: bun run test:coverage
