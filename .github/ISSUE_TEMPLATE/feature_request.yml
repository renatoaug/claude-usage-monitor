name: Feature request
description: Propose something new for Clauddy.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the feature does for someone using Clauddy.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The situation you are in when you would want this, with a real example if you have one. Not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What it would look like, or what the pet would do, from the user's point of view first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including "I do it by hand today", and why this one.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately leaves for later.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The checks that tell us it is done.
      value: |
        - [ ]
    validations:
      required: true
